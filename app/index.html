<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swanson Flatmap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="map-container"></div>
    <div id="info-panel">
      <div id="region-header">
        <span id="region-acronym"></span>
        <span id="region-name"></span>
      </div>
      <div id="no-data-reason" style="display:none">
        <span id="no-data-label"></span>
        <p id="no-data-text"></p>
      </div>
      <div id="mode-toggle">
        <button id="btn-efferent" class="active">Efferents</button>
        <button id="btn-afferent">Afferents</button>
      </div>
      <div id="metric-toggle">
        <button id="btn-relative" class="active">Relative</button>
        <button id="btn-absolute">Absolute</button>
      </div>
      <div id="metric-note"></div>
      <div id="connections-list"></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
